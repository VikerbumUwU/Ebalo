---

services:
  backend:
    build: ./backend  
    ports:
      - 8000:8000
    depends_on:
      - postgres
    
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: